name: posted_sdk
description: "Reports app installs to Posted for ad attribution. One call, reportInstall, sent once per install, through the native Posted SDKs."
version: 1.0.0
homepage: https://github.com/thepostedapp/posted-sdk-flutter
repository: https://github.com/thepostedapp/posted-sdk-flutter
issue_tracker: https://github.com/thepostedapp/posted-sdk-flutter/issues

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.postedapp.posted
        pluginClass: PostedFlutterPlugin
      ios:
        pluginClass: PostedFlutterPlugin

name: ci
on:
  pull_request: {}
  push: { branches: [main] }
jobs:
  static:                       # correctness authority for Flutter (dev host macOS 12 can't run Dart 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: touch example/.env   # asset referenced in pubspec.yaml; gitignored on dev, needs placeholder in CI
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed .
  build:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter test
